plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	runs {
		server {
			// Loads every mixin target on startup, so broken injections fail right away.
			vmArg "-Dblockprot.mixinAudit=true"
		}
	}
}

// Automated in-game tests: ./gradlew runGameTest -Pgametest
if (project.hasProperty("gametest")) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "blockprot-gametest"
			enableGameTests = true
			enableClientGameTests = false
			eula = true
		}
	}
	loom.runs.matching { it.name == "gameTest" }.configureEach {
		vmArg "-Dfabric-api.gametest.report-file=${project.file("build/gametest-report.xml").absolutePath.replace('\\', '/')}"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Permission nodes (blockprot.lock, blockprot.admin, ...) through LuckPerms & co. Bundled inside the jar.
	implementation "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
	include "me.lucko:fabric-permissions-api:${project.permissions_api_version}"

	// config.yml and the translation files keep the original Bukkit YAML format.
	implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"
	include "org.yaml:snakeyaml:${project.snakeyaml_version}"

	compileOnly "org.jetbrains:annotations:26.0.2"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
